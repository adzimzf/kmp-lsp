# Integration test: kmp-lsp against a fixture of jdtls's answers on
# google/gson (bench/compare/README.md, "Integration test"). Unlike `cargo
# test`, this drives the real server over LSP on a real repository with its
# dependencies resolved, so it catches what fixtures in-tree cannot: a
# resolution regression that only shows up with a Maven classpath, library
# sources and the JDK present.
name: Integration (gson)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'java-sidecar/**'
      - 'bench/compare/**'
      - 'Cargo.*'
      - '.github/workflows/integration-gson.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'java-sidecar/**'
      - 'bench/compare/**'
      - 'Cargo.*'
      - '.github/workflows/integration-gson.yml'
  workflow_dispatch:
    inputs:
      reference:
        description: "also run jdtls, which must score 100% on its own fixture"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Read by bench/compare/itest.sh.
  WORKDIR: ${{ github.workspace }}/lsp-compare

jobs:
  gson:
    name: kmp-lsp on gson (java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # kmp-lsp shells out to ripgrep for its definition fallback; without it
      # the scores drop for a reason that has nothing to do with the change.
      - name: Install ripgrep
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15
          sudo apt-get install -y ripgrep

      - name: Read the target's pinned commit
        id: target
        run: |
          echo "commit=$(python3 -c "import json;print(json.load(open('bench/compare/targets/gson.json'))['commit'])")" >> "$GITHUB_OUTPUT"

      - name: Cache the target's Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: gson-m2-${{ steps.target.outputs.commit }}
          restore-keys: gson-m2-

      - name: Build kmp-lsp
        run: cargo build --release

      # Library symbols of compiled jars come from the sidecar, as a normal
      # install has it: kmp-lsp finds it next to its own executable.
      - name: Build the JAR-indexer sidecar
        run: |
          (cd java-sidecar && ./gradlew --no-daemon -q shadowJar)
          cp java-sidecar/build/libs/kmp-jar-indexer.jar target/release/

      - name: Install jdtls
        if: inputs.reference
        run: |
          name=$(curl -fsL https://download.eclipse.org/jdtls/snapshots/latest.txt | tr -d '[:space:]')
          curl -fL -o /tmp/jdtls.tar.gz "https://download.eclipse.org/jdtls/snapshots/$name"
          mkdir -p /tmp/jdtls && tar -xzf /tmp/jdtls.tar.gz -C /tmp/jdtls
          echo "JDTLS=/tmp/jdtls" >> "$GITHUB_ENV"

      # jdtls snapshots need a newer JVM than the target's own build; the
      # target's Maven build keeps using the Java 21 of setup-java.
      - uses: actions/setup-java@v4
        if: inputs.reference
        with:
          java-version: '25'
          distribution: 'temurin'
          java-package: jdk
      - name: Point jdtls at Java 25
        if: inputs.reference
        run: echo "JAVA=$JAVA_HOME_25_X64/bin/java" >> "$GITHUB_ENV"

      - name: Integration test
        run: |
          bench/compare/itest.sh --workdir "$WORKDIR" \
            --servers "${{ inputs.reference && 'jdtls,kmp-lsp' || 'kmp-lsp' }}"
        env:
          BUILD_JDK: ${{ env.JAVA_HOME_21_X64 }}

      # The scores and every failure's expected-vs-actual, for a run that
      # fell below baseline (or one that is about to raise it).
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gson-results
          path: |
            ${{ env.WORKDIR }}/itest-results/*.json
            ${{ env.WORKDIR }}/itest-results/*.stderr.log
          if-no-files-found: warn

  selfcheck:
    name: the gate fails when it should
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 bench/compare/itest_selfcheck.py
